version: "3.8"

services:
    postgres:
        container_name: se-postgres
        image: postgres:16-alpine
        ports: ["5432:5432"]
        environment:
            - POSTGRES_USER=${DB_USERNAME:-postgres}
            - POSTGRES_PASSWORD=${DB_PASSWORD:-se202513}
            - POSTGRES_DB=${DB_NAME:-se_database}
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        container_name: se-redis
        image: redis:7.0-alpine
        ports: ["6379:6379"]
        volumes:
            - redis-data:/data
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:-}
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    postgres-data:
    redis-data:
